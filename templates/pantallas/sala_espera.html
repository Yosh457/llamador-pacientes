{% extends "base.html" %}
{% block title %}Sala de Espera - {{ pantalla.establecimiento.nombre }}{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap" rel="stylesheet">

<style>
    /* Sobreescribiendo el fondo base para la Smart TV */
    body { background-color: #0f172a !important; color: white !important; overflow: hidden; margin: 0; padding: 0; }
    main { padding: 0 !important; margin: 0 !important; }
    
    #pantalla-app-container {
        font-family: 'Roboto', sans-serif !important;
        height: 100vh; width: 100vw; position: fixed;
        top: 0; left: 0; z-index: 99999; 
        display: none; 
    }
    #pantalla-app-container.ready { display: flex; flex-direction: column; }
    
    .screen-header { width: 100%; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background-color: white; }
    .screen-header img { max-height: 80px; width: auto; }
    
    .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; overflow-y: hidden; }
    
    .footer-history { flex-shrink: 0; background-color: #1e293b; padding: 2rem 2rem; width: 100%; border-top: 1px solid #334155; }
    
    /* Tipografía Original */
    #call-type-title { font-size: 3.5rem !important; font-weight: 900 !important; text-transform: uppercase !important; letter-spacing: 0.05em !important; margin-bottom: 2rem !important; text-align: center; color: #f59e0b !important; }
    .history-title { font-size: 2.5rem !important; font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: 0.1em !important; margin-bottom: 1.5rem !important; color: #94a3b8 !important; text-align: center; }
    
    #start-overlay { position: absolute; inset: 0; background-color: rgba(15, 23, 42, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; cursor: pointer; }
    #start-overlay h2 { font-size: 4rem !important; font-weight: 900 !important; color: white !important; margin-bottom: 1rem !important; font-family: 'Roboto', sans-serif !important; }
    #start-overlay p { font-size: 1.5rem !important; color: #cbd5e1 !important; margin-bottom: 2rem !important; font-family: 'Roboto', sans-serif !important; }
    
    /* Cuadro de Llamado Activo */
    .current-call-item { display: flex !important; flex-direction: column; align-items: center !important; width: 100%; max-width: 95rem; margin-left: auto; margin-right: auto; background: #ffffff !important; border-radius: 0.5rem !important; padding: 3rem 4rem 2rem 4rem !important; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4) !important; transform: scale(0.95) translateY(20px); opacity: 0; animation: pantallaFadeIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; margin-bottom: 1.5rem; }
    @keyframes pantallaFadeIn { to { transform: scale(1) translateY(0); opacity: 1; } }
    
    .call-main-info { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .patient-name { font-size: 4rem !important; font-weight: 900 !important; color: #1e293b !important; text-transform: uppercase; line-height: 1.1; text-align: left; flex: 1; }
    .box-name { font-size: 4rem !important; font-weight: 700 !important; color: #0d9488 !important; line-height: 1.1; text-align: right; white-space: nowrap; margin-left: 2rem; }
    .call-timestamp { width: 100%; text-align: center; margin-top: 2rem; font-size: 1.75rem !important; font-weight: 700 !important; color: #94a3b8 !important; }
    
    /* Grilla de Historial */
    .history-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; text-align: center; width: 100%; max-width: 120rem; margin: 0 auto; }
    .history-group { background: #0f172a !important; border-left: 6px solid #0d9488 !important; padding: 1.5rem !important; border-radius: 0.5rem !important; display: flex; flex-direction: column; justify-content: center; }
    .patient-name-history { font-weight: 900 !important; text-transform: uppercase; font-size: 2rem !important; color: white !important; line-height: 1.2; }
    .box-name-history { font-size: 1.5rem !important; color: #cbd5e1 !important; margin-top: 0.5rem !important; font-weight: 700 !important; }
    .call-timestamp-history { margin-top: 0.5rem; font-size: 1.125rem !important; color: #64748b !important; font-weight: 700 !important; }
    
    /* Mensaje de Espera */
    .waiting-message { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .waiting-text { font-size: 3rem !important; font-weight: 700 !important; color: #e2e8f0 !important; line-height: 1.4; }
    .center-name { font-size: 6rem !important; font-weight: 900 !important; color: white !important; margin-top: 2rem; text-transform: uppercase; letter-spacing: 0.02em; }
</style>

<meta name="pantalla-token" content="{{ pantalla.token_acceso }}">

<div id="start-overlay">
    <h2>SALA DE ESPERA</h2>
    <p>Haga clic aquí para iniciar el motor de audio e imagen</p>
    <svg style="width: 6rem; height: 6rem; color: white;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 0 1 0 .656l-5.603 3.113a.375.375 0 0 1-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112Z" />
    </svg>
</div>

<div id="pantalla-app-container">
    <header class="screen-header">
        <img src="{{ url_for('static', filename='img/Logo_Red_APS_2.png') }}" alt="Logo Red APS">
        <img src="{{ url_for('static', filename='img/logoMaho.png') }}" alt="Logo MAHO">
    </header>
    
    <div class="main-content">
        <h1 id="call-type-title" style="display: none;"></h1> 
        <div id="current-calls-list" class="w-full flex flex-col items-center">
            </div>
    </div>
    
    <div class="footer-history">
        <h2 class="history-title">ÚLTIMOS LLAMADOS</h2>
        <div id="history-list" class="history-grid">
            </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pantalla_publica.js') }}"></script>
{% endblock %}
